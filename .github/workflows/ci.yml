name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Select guarded areas
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.select.outputs.core }}
      contract: ${{ steps.select.outputs.contract }}
      base: ${{ steps.select.outputs.base }}
      head: ${{ steps.select.outputs.head }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select and validate gates
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          core=false
          contract=false
          contract_surface=false
          guard_script=false

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base "$PR_BASE" "$PR_HEAD")
            head="$PR_HEAD"
          else
            head="$PUSH_HEAD"
            base="$PUSH_BASE"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base=$(git rev-parse "$head^")
            fi
          fi

          changed=$(git diff --name-only --no-renames "$base" "$head")
          if [ -z "$changed" ]; then
            echo "No changed files in $base..$head" >&2
            exit 1
          fi

          while IFS= read -r path; do
            case "$path" in
              contracts/*|crates/swe-native/src/journal.rs|crates/swe-native/src/definition.rs|crates/swe-native/src/needs.rs|crates/swe-native/src/evidence.rs|crates/swe-native/src/operations.rs|crates/swe-reference/src/journal.rs|python/swe/swd_v1.schema.json|python/swe/schema.py)
                contract_surface=true
                core=true
                ;;
              scripts/check_contract_freeze.py|scripts/test_check_contract_freeze.py)
                guard_script=true
                core=true
                ;;
              crates/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|mutations/*|scripts/check_mutations.py|scripts/test_check_mutations.py|.github/workflows/*)
                core=true
                ;;
              *)
                ;;
            esac
          done <<< "$changed"

          if [ "$contract_surface" = true ] || [ "$guard_script" = true ] || grep -q '^\.github/workflows/' <<< "$changed"; then
            contract=true
          fi

          for gate in \
            scripts/check_contract_freeze.py \
            scripts/test_check_contract_freeze.py \
            scripts/check_mutations.py \
            scripts/test_check_mutations.py \
            mutations/baseline.json; do
            if git cat-file -e "$base:$gate" 2>/dev/null && ! git cat-file -e "$head:$gate" 2>/dev/null; then
              echo "Required gate artifact was deleted: $gate" >&2
              exit 1
            fi
          done

          {
            echo "core=$core"
            echo "contract=$contract"
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p swe-reference

  python:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build native wheel and run the standalone suite
        shell: bash
        run: |
          set -euo pipefail
          cd python
          uv sync --locked --group dev
          cd ..
          uvx maturin build \
            --manifest-path crates/swe-native/Cargo.toml \
            --interpreter python/.venv/bin/python \
            --out /tmp/swe-native-wheel
          cd python
          uv pip install --reinstall /tmp/swe-native-wheel/*.whl
          uv run --no-sync pytest -m "not smoke"
      - name: Prove the Python distribution installs outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          cd python
          uv build --out-dir /tmp/swe-engine-dist
          cd /tmp
          uv venv /tmp/swe-engine-venv --python 3.12
          uv pip install --python /tmp/swe-engine-venv/bin/python /tmp/swe-engine-dist/*.whl
          /tmp/swe-engine-venv/bin/python -c "import swe; swe.load_schema(); print(swe.__file__)"

  contracts:
    name: Contract freeze
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
      - run: python3 scripts/test_check_contract_freeze.py
      - name: Check this change against its base
        env:
          BASE: ${{ needs.changes.outputs.base }}
          HEAD: ${{ needs.changes.outputs.head }}
        run: python3 scripts/check_contract_freeze.py --base "$BASE" --head "$HEAD"

  mutation:
    name: Classified mutation gate
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/test_check_mutations.py
      - name: Run the verified baseline offline
        run: |
          cargo fetch --locked
          python3 scripts/check_mutations.py --offline

  licenses:
    name: Licenses and notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
      - run: python3 scripts/check_licenses.py

  packages:
    name: Package dry runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: cargo package --locked -p swe-budget
      - run: cargo package --locked -p swe-native
      - run: cd python && uv build
      - run: uvx maturin sdist --manifest-path crates/swe-native/Cargo.toml --out /tmp/swe-native-sdist

  ci:
    name: CI
    if: always()
    needs: [changes, rust, python, contracts, mutation, licenses, packages]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.rust.result }}
          PYTHON: ${{ needs.python.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          MUTATION: ${{ needs.mutation.result }}
          LICENSES: ${{ needs.licenses.result }}
          PACKAGES: ${{ needs.packages.result }}
          CONTRACT_REQUIRED: ${{ needs.changes.outputs.contract }}
          CORE_REQUIRED: ${{ needs.changes.outputs.core }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$CHANGES" "$RUST" "$PYTHON" "$LICENSES" "$PACKAGES"; do
            [ "$result" = success ] || exit 1
          done
          if [ "$CONTRACT_REQUIRED" = true ]; then
            [ "$CONTRACTS" = success ] || exit 1
          else
            [ "$CONTRACTS" = skipped ] || [ "$CONTRACTS" = success ] || exit 1
          fi
          if [ "$CORE_REQUIRED" = true ]; then
            [ "$MUTATION" = success ] || exit 1
          else
            [ "$MUTATION" = skipped ] || [ "$MUTATION" = success ] || exit 1
          fi
