version: "1.0"
name: runtime_parallel
entrypoint: dispatch
limits:
  max_steps: 100
  max_depth: 10
  timeout_seconds: 30
nodes:
  dispatch:
    type: fork
    branches:
      catalog: fetch_catalog
      pricing: fetch_pricing
    join: combine
  fetch_catalog:
    type: task
    handler: demo.fetch_catalog
  fetch_pricing:
    type: task
    handler: demo.fetch_pricing
  combine:
    type: join
    mode: all
    on_failure: fail
    outputs:
      catalog: "$.branches.catalog.result"
      pricing: "$.branches.pricing.result"
    next: check_budget
  check_budget:
    type: decision
    evaluator: expression
    condition:
      lt:
        - var: "$.run.steps_used"
        - var: "$.run.max_steps"
    routes:
      "true": end_complete
      "false": end_incomplete
  end_complete:
    type: end
    status: completed
  end_incomplete:
    type: end
    status: incomplete
