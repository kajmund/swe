[workspace]
resolver = "2"
members = [
    "crates/swe-budget",
    "crates/swe-native",
    "crates/swe-reference",
]
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kajmund/swe"
homepage = "https://github.com/kajmund/swe"

[profile.release]
lto = false
codegen-units = 16
